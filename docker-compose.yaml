version: '3'

services:
  developer-helper:
    container_name: developer-helper
    image: abhishek1009/developer-helper:slim
    build:
      context: .  # Set the build context to the docs directory
      dockerfile: Dockerfile.docs  # Specify the Dockerfile to use
    ports:
      - "8000:8000"
    # volume mount so that it will get the local changes automatically
    volumes:
      - ./:/home/abhishek/workspace/developer-helper  # Mounts the local docs directory to /docs in the container
